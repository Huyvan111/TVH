<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/img7.jpg">
  <title>💀 ĐỘI TUYỂN TIN CHUYÊN BÌNH LONG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09111f;
      --card-bg: rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.08);
      --accent: #ff6b6b;
      --accent2: #ffd166;
      --text: rgba(255,255,255,0.88);
      --muted: rgba(255,255,255,0.45);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(255,107,107,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(255,209,102,0.08) 0%, transparent 55%),
        #09111f;
    }

    /* ── HEADER ── */
    .site-header {
      text-align: center;
      padding: 52px 20px 36px;
    }

    .site-title {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(28px, 6vw, 58px);
      letter-spacing: 3px;
      line-height: 1.25;
      color: #fff;
      text-shadow: 0 0 40px rgba(255,107,107,0.4);
    }

    .site-title span { color: var(--accent); }

    .site-sub {
      margin-top: 10px;
      font-size: 14px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 2px;
      margin: 18px auto 0;
    }

    /* ── GROUPS GRID ── */
    .groups-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 20px 60px;
    }

    .groups-label {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
      text-align: center;
    }

    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
    }

    .group-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 32px 20px 28px;
      text-align: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .group-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,107,107,0.08), rgba(255,209,102,0.04));
      opacity: 0;
      transition: opacity 0.25s;
    }

    .group-card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,107,107,0.4);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,107,107,0.2);
    }

    .group-card:hover::before { opacity: 1; }

    .group-card .icon {
      font-size: 36px;
      margin-bottom: 12px;
      display: block;
      line-height: 1;
    }

    .group-card .cohort-name {
      font-family: 'Oswald', sans-serif;
      font-size: 30px;
      letter-spacing: 2px;
      color: #fff;
      line-height: 1;
    }

    .group-card .cohort-year {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      letter-spacing: 1px;
    }

    .group-card .photo-count {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 14px;
      font-size: 12px;
      background: rgba(255,107,107,0.12);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Color accent per card */
    .group-card:nth-child(1) .cohort-name { color: #ff6b6b; }
    .group-card:nth-child(2) .cohort-name { color: #ffd166; }
    .group-card:nth-child(3) .cohort-name { color: #06d6a0; }
    .group-card:nth-child(4) .cohort-name { color: #74b9ff; }
    .group-card:nth-child(1):hover { border-color: rgba(255,107,107,0.5); }
    .group-card:nth-child(2):hover { border-color: rgba(255,209,102,0.5); }
    .group-card:nth-child(3):hover { border-color: rgba(6,214,160,0.5); }
    .group-card:nth-child(4):hover { border-color: rgba(116,185,255,0.5); }

    /* ── GALLERY VIEW ── */
    .gallery-view {
      display: none;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    .gallery-view.active { display: block; }

    .gallery-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      margin-bottom: 28px;
      transition: background 0.2s;
    }

    .gallery-back:hover { background: rgba(255,255,255,0.13); }

    .gallery-heading {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(32px, 7vw, 60px);
      letter-spacing: 3px;
      margin-bottom: 6px;
    }

    .gallery-heading-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .gallery-item {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,0.03);
      box-shadow: 0 8px 28px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .gallery-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.65);
    }

    .gallery-item img,
    .gallery-item video {
      display: block;
      width: 100%;
      height: 280px;
      object-fit: cover;
      transition: transform 0.35s cubic-bezier(.2,.9,.2,1);
    }

    .gallery-item:hover img,
    .gallery-item:hover video {
      transform: scale(1.06);
    }

    .gallery-item figcaption {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      padding: 5px 10px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      text-align: center;
    }

    .video-play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 52px;
      height: 52px;
      background: rgba(0,0,0,0.55);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      pointer-events: none;
      backdrop-filter: blur(3px);
      border: 2px solid rgba(255,255,255,0.3);
    }

    /* ── FULLSCREEN MODAL ── */
    #fs-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }

    #fs-overlay.active { display: flex; }

    #fs-box {
      position: relative;
      max-width: min(92vw, 960px);
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #fs-media {
      max-width: 100%;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 10px 50px rgba(0,0,0,0.7);
      display: block;
    }

    #fs-caption {
      color: #fff;
      font-size: 0.95rem;
      opacity: 0.8;
      text-align: center;
      font-weight: 600;
    }

    #fs-close {
      position: fixed;
      top: 16px;
      right: 20px;
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      font-size: 1.4rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 10001;
    }
    #fs-close:hover { background: rgba(255,255,255,0.3); }

    .fs-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      font-size: 1.8rem;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 10001;
    }
    .fs-nav:hover { background: rgba(255,255,255,0.3); }
    #fs-prev { left: 14px; }
    #fs-next { right: 14px; }

    #fs-counter {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.6);
      font-size: 0.82rem;
      z-index: 10001;
      font-family: 'Nunito', sans-serif;
    }

    @media (max-width: 600px) {
      .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
      .gallery-item img, .gallery-item video { height: 180px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <h1 class="site-title">ĐỘI TUYỂN TIN<br><span>CHUYÊN BÌNH LONG</span></h1>
  <p class="site-sub">📸 Album ảnh kỷ niệm các niên khóa</p>
  <div class="divider"></div>
</header>

<!-- GROUP SELECTION -->
<div class="groups-wrap" id="groups-section">
  <p class="groups-label">Chọn niên khóa</p>
  <div class="groups-grid">

    <div class="group-card" onclick="openGroup('k1112')">
      <span class="icon">🔥</span>
      <div class="cohort-name">K11–12</div>
      <div class="cohort-year">Niên khóa 2011 – 2012</div>
      <div class="photo-count">📷 Xem ảnh</div>
    </div>

    <div class="group-card" onclick="openGroup('k1213')">
      <span class="icon">⚡</span>
      <div class="cohort-name">K12–13</div>
      <div class="cohort-year">Niên khóa 2012 – 2013</div>
      <div class="photo-count">📷 Xem ảnh</div>
    </div>

    <div class="group-card" onclick="openGroup('k1415')">
      <span class="icon">💎</span>
      <div class="cohort-name">K14–15</div>
      <div class="cohort-year">Niên khóa 2014 – 2015</div>
      <div class="photo-count">📷 Xem ảnh</div>
    </div>

    <div class="group-card" onclick="openGroup('k1516')">
      <span class="icon">🌟</span>
      <div class="cohort-name">K15–16</div>
      <div class="cohort-year">Niên khóa 2015 – 2016</div>
      <div class="photo-count">📷 Xem ảnh</div>
    </div>

  </div>
</div>

<!-- GALLERY VIEW (shown after clicking a group) -->
<div class="gallery-view" id="gallery-section">
  <button class="gallery-back" onclick="goBack()">← Quay lại</button>
  <div id="gallery-heading" class="gallery-heading"></div>
  <div id="gallery-heading-sub" class="gallery-heading-sub"></div>
  <section class="gallery-grid" id="gallery-grid"></section>
</div>

<!-- FULLSCREEN MODAL -->
<div id="fs-overlay">
  <button id="fs-close">✕</button>
  <button id="fs-prev" class="fs-nav">&#8249;</button>
  <button id="fs-next" class="fs-nav">&#8250;</button>
  <span id="fs-counter"></span>
  <div id="fs-box">
    <img id="fs-media" src="" alt="">
    <p id="fs-caption"></p>
  </div>
</div>

<script>
// ============================================================
//  DATA: Thêm ảnh vào từng group tại đây
//  Mỗi item: { src, caption, isVideo (optional) }
// ============================================================
const GROUPS = {
  k1112: {
    name: 'K11–12',
    sub: 'Niên khóa 2011 – 2012',
    color: '#ff6b6b',
    items: [
      { src: 'img1.jpg', caption: 'Đày Tộ' },
      { src: 'img2.jpg', caption: 'Pìa Ngủ 1' },
      { src: 'img3.jpg', caption: 'Sigma' },
      { src: 'img4.jpg', caption: 'Gian' },
      { src: 'img5.jpg', caption: 'Doggy Pìa' },
      { src: 'img6.jpg', caption: 'Dang ngu' },
      { src: 'img7.jpg', caption: 'Room Review' },
      { src: 'img8.jpg', caption: 'Sigma 2' },
      { src: 'img9.jpg', caption: 'Ư Sêd' },
      { src: 'img10.jpg', caption: 'Cool' },
      { src: 'img11.jpg', caption: 'bigdik' },
      { src: 'img12.jpg', caption: 'Cum' },
      { src: 'img13.jpg', caption: 'Among Ú' },
      { src: 'img14.jpg', caption: 'Loop' },
      { src: 'img15.jpg', caption: 'Dang Nghien' },
      { src: 'img16.jpg', caption: 'Đa Cấp' },
      { src: 'img17.jpg', caption: 'or2' },
      { src: 'img18.jpg', caption: 'Cu Dệ' },
      { src: 'img19.jpg', caption: 'Chại Giống' },
      { src: 'img20.jpg', caption: 'Monke' },
      { src: 'img21.jpg', caption: 'Khò' },
      { src: 'img22.jpg', caption: 'Cu dệ 2' },
      { src: 'img23.jpg', caption: 'Hu Ngi' },
      { src: 'img24.jpg', caption: 'Bia ngu 1' },
      { src: 'img25.jpg', caption: 'Bia ngu 2' },
      { src: 'img26.jpg', caption: 'Ngo ngac' },
      { src: 'img27.jpg', caption: 'Dang kho' },
      { src: 'img28.jpg', caption: '...' },
      { src: 'img29.jpg', caption: 'HeHe' },
      { src: 'img30.jpg', caption: 'Đói à' },
      { src: 'img31.jpg', caption: '@Huylee' },
      { src: 'img32.jpg', caption: 'Sumo no pro' },
      { src: 'img33.jpg', caption: '@Huylee2' },
      { src: 'img34.jpg', caption: ':3' },
      { src: 'img35.jpg', caption: 'Sleep...' },
      { src: 'video1.mp4', caption: 'Hay tời', isVideo: true },
      { src: 'video.mp4', caption: 'Chad Sigma male', isVideo: true },
      { src: 'video2.mp4', caption: 'Yamateeeee', isVideo: true },
    ]
  },
  k1213: {
    name: 'K12–13',
    sub: 'Niên khóa 2012 – 2013',
    color: '#ffd166',
    items: [
    ]
  },
  k1415: {
    name: 'K14–15',
    sub: 'Niên khóa 2014 – 2015',
    color: '#06d6a0',
    items: [

    ]
  },
  k1516: {
    name: 'K15–16',
    sub: 'Niên khóa 2015 – 2016',
    color: '#74b9ff',
    items: [
      
    ]
  }
};

// ============================================================
//  GALLERY LOGIC
// ============================================================
let currentGroupKey = null;
let fsItems = [];
let fsCurrent = 0;

function openGroup(key) {
  currentGroupKey = key;
  const group = GROUPS[key];
  const grid = document.getElementById('gallery-grid');

  document.getElementById('gallery-heading').textContent = group.name;
  document.getElementById('gallery-heading').style.color = group.color;
  document.getElementById('gallery-heading-sub').textContent = group.sub + ' — ' + group.items.length + ' items';

  grid.innerHTML = '';
  fsItems = group.items;

  group.items.forEach((item, idx) => {
    const fig = document.createElement('figure');
    fig.className = 'gallery-item';
    fig.style.cursor = 'pointer';

    if (item.isVideo) {
      const vid = document.createElement('video');
      vid.src = item.src;
      vid.preload = 'metadata';
      vid.muted = true;
      fig.appendChild(vid);

      const playIcon = document.createElement('div');
      playIcon.className = 'video-play-icon';
      playIcon.textContent = '▶';
      fig.appendChild(playIcon);
    } else {
      const img = document.createElement('img');
      img.src = item.src;
      img.alt = item.caption;
      img.loading = 'lazy';
      fig.appendChild(img);
    }

    const cap = document.createElement('figcaption');
    cap.textContent = item.caption;
    fig.appendChild(cap);

    fig.addEventListener('click', () => fsShow(idx));
    grid.appendChild(fig);
  });

  document.getElementById('groups-section').style.display = 'none';
  document.getElementById('gallery-section').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goBack() {
  document.getElementById('gallery-section').classList.remove('active');
  document.getElementById('groups-section').style.display = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
//  FULLSCREEN MODAL
// ============================================================
const overlay = document.getElementById('fs-overlay');
const fsBox   = document.getElementById('fs-box');
const fsClose = document.getElementById('fs-close');
const fsPrev  = document.getElementById('fs-prev');
const fsNext  = document.getElementById('fs-next');
const fsCounter = document.getElementById('fs-counter');

function fsShow(index) {
  fsCurrent = (index + fsItems.length) % fsItems.length;
  const item = fsItems[fsCurrent];

  let el = document.getElementById('fs-media');
  const needVideo = !!item.isVideo;

  if (needVideo && el.tagName === 'IMG') {
    const v = document.createElement('video');
    v.id = 'fs-media'; v.controls = true; v.autoplay = true;
    v.style.cssText = el.style.cssText;
    el.replaceWith(v); el = v;
    el.style.maxWidth = '100%';
    el.style.maxHeight = '82vh';
    el.style.borderRadius = '10px';
  } else if (!needVideo && el.tagName === 'VIDEO') {
    el.pause();
    const i = document.createElement('img');
    i.id = 'fs-media';
    i.style.cssText = 'max-width:100%;max-height:82vh;object-fit:contain;border-radius:10px;box-shadow:0 10px 50px rgba(0,0,0,0.7);display:block;';
    el.replaceWith(i); el = i;
  }

  el.src = item.src;
  document.getElementById('fs-caption').textContent = item.caption;
  fsCounter.textContent = `${fsCurrent + 1} / ${fsItems.length}`;
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function fsCloseModal() {
  overlay.classList.remove('active');
  document.body.style.overflow = '';
  const v = fsBox.querySelector('video#fs-media');
  if (v) v.pause();
}

fsClose.addEventListener('click', fsCloseModal);
fsPrev.addEventListener('click', () => fsShow(fsCurrent - 1));
fsNext.addEventListener('click', () => fsShow(fsCurrent + 1));
overlay.addEventListener('click', e => { if (e.target === overlay) fsCloseModal(); });

document.addEventListener('keydown', e => {
  if (!overlay.classList.contains('active')) return;
  if (e.key === 'Escape')     fsCloseModal();
  if (e.key === 'ArrowLeft')  fsShow(fsCurrent - 1);
  if (e.key === 'ArrowRight') fsShow(fsCurrent + 1);
});
</script>

</body>
</html>
