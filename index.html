<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TVHBot - Hunye</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>TVHBot</h1>
    <p>Web by Hunye</p>
    <p><a href="https://www.youtube.com/watch?v=xvFZjo5PgG0" target="_blank">
      → Click here to test it live
    </a></p>
    <hr>

    <!-- YouTube Video - Autoplay with SOUND (unmuted) -->
    <div class="youtube-container" id="player">
      <iframe 
        src="https://www.youtube.com/embed/xvFZjo5PgG0?autoplay=1&mute=0&rel=0&modestbranding=1&playsinline=1&enablejsapi=1" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>

    <small style="margin-top: 30px; display: block;">
      DM me on <a href="https://www.facebook.com/tranvan.huy.718" target="_blank">Facebook</a>
    </small>
  </div>

  <!-- Small script to force unmute + autoplay on user interaction (required by browsers) -->
  <script>
    document.addEventListener('click', function() {
      const iframe = document.querySelector('iframe');
      if (iframe) {
        iframe.src = iframe.src; // Re-triggers autoplay + unmute after first click
      }
    }, { once: true });
  </script>

</body>
</html>
